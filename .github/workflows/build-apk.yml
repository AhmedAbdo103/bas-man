
name: Build BasMan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon*.png www/
          if [ -f sw.js ]; then
            cp sw.js www/
          fi

      - name: Prepare app logo
        run: |
          mkdir -p assets
          cp icon.png assets/logo.png

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#10243A'

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BasMan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
