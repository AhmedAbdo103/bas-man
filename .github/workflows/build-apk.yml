
name: Build BasMan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon*.png www/

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

      - name: Prepare app icons
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/splash.png

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BasMan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
